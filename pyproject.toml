[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reolink-protect-events"
version = "1.5.0"
description = "Native UniFi Protect import of Reolink AI and optional Frigate object detections"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
thumbnails = ["Pillow>=11.3,<13"]

[tool.setuptools.packages.find]
include = ["reolink_protect_events*"]
