name: Offline contracts
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'Pillow>=11.3,<13'
      - run: python -m unittest discover -s tests
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps .
      - run: python -c "import reolink_protect_events.controls_ui_guard, reolink_protect_events.runtime, reolink_protect_events.verification"
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: docker pull postgres:16
      - run: python tools/test_postgres.py
